<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식물세포 단톡방</title>
<style>
:root{
  --kakao-bg:#9bb2c4;
  --kakao-yellow:#fae100;
  --ink:#0d1a15;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(ellipse at 25% 0%, #1a3d31 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, #143528 0%, transparent 50%),
    #0b1f18;
  font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Nanum Gothic",sans-serif;
  min-height:100%;
  padding:22px;
  display:flex;justify-content:center;align-items:center;
}
.phone{
  width:100%;max-width:860px;
  background:var(--kakao-bg);
  border-radius:24px;overflow:hidden;
  border:3px solid #2c5c4b;
  box-shadow:0 26px 70px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
  height:min(94vh,1040px);
  position:relative;
}

/* 대화상대 보기 */
.kbar .cnt,.kbar .dots{cursor:pointer;transition:opacity .15s;}
.kbar .cnt:hover,.kbar .dots:hover{opacity:.55;}
.scrim{
  position:absolute;inset:0;background:rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .28s;z-index:5;
}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(62%,430px);
  background:#f4f6f7;z-index:6;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(0,0,0,.3);
}
.drawer.open{transform:none;}
.dhead{
  background:#8ba6ba;padding:18px 20px;display:flex;align-items:center;gap:10px;flex:none;
}
.dhead b{font-size:23px;color:#1b2a33;}
.dhead .x{margin-left:auto;font-size:30px;color:#22333d;cursor:pointer;line-height:1;
  background:none;border:none;font-family:inherit;padding:0 4px;}
.dhead .x:hover{opacity:.55}
.dlist{flex:1;overflow-y:auto;padding:10px 0;}
.dsec{font-size:16px;font-weight:800;color:#61798a;padding:12px 20px 6px;letter-spacing:.5px;}
.member{display:flex;align-items:center;gap:14px;padding:13px 20px;}
.member img{width:62px;height:62px;border-radius:21px;background:#fff;object-fit:cover;flex:none;
  box-shadow:0 2px 5px rgba(0,0,0,.14);}
.member .mi{min-width:0;}
.member .mn{font-size:22px;font-weight:800;color:#17242b;display:flex;align-items:center;gap:7px;}
.member .mn i{font-style:normal;font-size:14px;font-weight:800;background:#fae100;color:#4a3d00;
  padding:3px 8px;border-radius:7px;}
.member .ms{font-size:17px;color:#5f7382;margin-top:4px;line-height:1.4;word-break:keep-all;}
.member+.member{border-top:1px solid #e2e7ea;}

/* 말하는 중 표시 */
.row.speaking .pfp{box-shadow:0 0 0 4px #2f6d57, 0 2px 8px rgba(0,0,0,.25);
  animation:talk .7s ease-in-out infinite;}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.toast{
  position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);
  background:rgba(20,40,33,.94);color:#dff5e9;font-size:17px;line-height:1.5;
  padding:12px 18px;border-radius:14px;max-width:80%;text-align:center;
  opacity:0;pointer-events:none;transition:.3s;z-index:7;word-break:keep-all;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.kbar{
  background:#8ba6ba;padding:16px 22px;
  display:flex;align-items:center;gap:13px;
  border-bottom:1px solid rgba(0,0,0,.08);flex:none;
}
.kbar .arrow{font-size:28px;color:#22333d;}
.kbar h1{font-size:27px;color:#1b2a33;font-weight:800;letter-spacing:-.5px;}
.kbar .cnt{font-size:23px;color:#4a6070;font-weight:700;}
.kbar .dots{margin-left:auto;font-size:26px;color:#22333d;letter-spacing:2px;}

.feed{flex:1;overflow-y:auto;padding:24px 22px 30px;scroll-behavior:smooth;cursor:pointer;}
.feed::-webkit-scrollbar{width:9px}
.feed::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px}

.daypill{
  text-align:center;margin:2px auto 22px;width:fit-content;
  background:rgba(0,0,0,.16);color:#f2f7fa;
  font-size:18px;padding:7px 20px;border-radius:20px;
}

.row{display:flex;gap:13px;margin-bottom:19px;align-items:flex-start;
  animation:pop .32s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse;}
.pfp{width:66px;height:66px;border-radius:22px;flex:none;background:#fff;object-fit:cover;
  box-shadow:0 2px 6px rgba(0,0,0,.18);}
.bcol{max-width:76%;display:flex;flex-direction:column;}
.row.me .bcol{align-items:flex-end;}
.who{font-size:19px;color:#22333d;margin:2px 0 7px;font-weight:700;}
.bline{display:flex;align-items:flex-end;gap:8px;}
.row.me .bline{flex-direction:row-reverse;}
.bub{
  background:#fff;color:var(--ink);
  padding:15px 19px;border-radius:7px 18px 18px 18px;
  font-size:28px;line-height:1.5;letter-spacing:-.5px;
  word-break:keep-all;box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.row.me .bub{background:var(--kakao-yellow);border-radius:18px 7px 18px 18px;}
.time{font-size:15px;color:#3f5462;white-space:nowrap;padding-bottom:3px;}

.kw{font-weight:900;padding:0 3px;border-radius:5px;}
.kw.g{background:#c7f2d3;box-shadow:inset 0 -9px 0 #a8e8bd;}
.kw.o{background:#ffd9d1;box-shadow:inset 0 -9px 0 #ffc0b2;}
.kw.b{background:#cfe4ff;box-shadow:inset 0 -9px 0 #b3d3ff;}
.kw.y{background:#ffeeb0;box-shadow:inset 0 -9px 0 #ffe287;}

.sysline{text-align:center;margin:24px 0;}
.sysline span{
  display:inline-block;background:rgba(0,0,0,.2);color:#fff;
  padding:11px 24px;border-radius:24px;font-size:23px;letter-spacing:4px;
  animation:shake .35s linear infinite;
}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}

.typing .bub{padding:19px 22px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8d9aa3;margin:0 3px;
  animation:bounce 1s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-8px);opacity:1}}

.controls{flex:none;background:#e9eef1;padding:14px;display:flex;gap:11px;align-items:center;
  border-top:1px solid rgba(0,0,0,.1);}
.btn{font-family:inherit;border:none;cursor:pointer;border-radius:13px;
  font-weight:800;letter-spacing:-.3px;transition:transform .12s,filter .12s;}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{flex:1;background:#2f6d57;color:#fff;font-size:30px;padding:18px;}
.btn.sub{background:#c3cfd6;color:#22333d;font-size:19px;padding:18px 16px;}
.btn.sub.on{background:#2f6d57;color:#fff;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="phone">
  <div class="kbar">
    <span class="arrow">‹</span>
    <h1>🌿 식물세포 단톡방</h1>
    <span class="cnt" id="cntBtn" title="대화상대 보기">3</span>
    <span class="dots" id="menuBtn" title="대화상대 보기">⋮</span>
  </div>
  <div class="feed" id="feed">
    <div class="daypill">광합성과 세포호흡</div>
  </div>
  <div class="controls">
    <button class="btn main" id="next">대화 시작 ▶</button>
    <button class="btn sub" id="tts">🔇 소리</button>
    <button class="btn sub" id="auto">자동</button>
    <button class="btn sub" id="back">이전</button>
    <button class="btn sub" id="reset">처음</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="dhead">
      <b>대화상대 3</b>
      <button class="x" id="closeDrawer" aria-label="닫기">×</button>
    </div>
    <div class="dlist" id="dlist"></div>
  </aside>
</div>

  const all=synth.getVoices();
  if(!all.length)return;
  koVoices=all.filter(v=>(v.lang||'').toLowerCase().startsWith('ko'));
  if(!koVoices.length)koVoices=all.slice(0,3);
  voiceReady=true;
}
if(synth){loadVoices();synth.addEventListener('voiceschanged',loadVoices);}

function cleanForSpeech(t){
  return t
    .replace(/\[\[(.+?)\|.+?\]\]/g,'$1')
    .replace(/ATP/g,'에이티피')
    .replace(/ㅇㅋ/g,'오케이')
    .replace(/ㅇㅇ/g,'응응')
    .replace(/[ㅋㅌㅎ]{2,}/g,' 하하 ')
    .replace(/([!?])\1+/g,'$1')
    .replace(/[;~]/g,' ')
    .replace(/[\u3131-\u314E\u314F-\u3163]/g,'')
    .replace(/\s+/g,' ').trim();
}

function stopSpeech(){
  if(synth)synth.cancel();
  document.querySelectorAll('.row.speaking').forEach(e=>e.classList.remove('speaking'));
}

function speak(m,onend){
  if(!ttsOn||!synth){onend&&onend();return;}
  const raw=m.sys?(m.say||m.sys):m.t;
  const txt=cleanForSpeech(raw);
  if(!txt){onend&&onend();return;}
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='ko-KR';
  const tone=m.w?TONE[m.w]:{pitch:1,rate:1,vi:0};
  u.pitch=tone.pitch; u.rate=tone.rate; u.volume=1;
  if(koVoices.length)u.voice=koVoices[tone.vi % koVoices.length];
  const row=feed.lastElementChild;
  if(row&&row.classList.contains('row'))row.classList.add('speaking');
  let done=false,started=false;
  const finish=()=>{if(done)return;done=true;
    if(row&&row.classList)row.classList.remove('speaking');onend&&onend();};
  u.onstart=()=>{started=true;};
  u.onend=finish; u.onerror=finish;
  setTimeout(()=>{try{synth.speak(u);}catch(e){finish();}},60);
  // 음성 엔진이 실제로 시작되지 않으면 즉시 다음으로
  setTimeout(()=>{if(!started&&!synth.speaking)finish();},650);
  // 최대 대기 시간 (엔진이 끝을 알려주지 않는 경우 대비)
  setTimeout(finish, 2500+txt.length*180);
}

const toast=document.getElementById('toast');
let toastT=null;
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),4200);
}
function scrollEnd(){feed.scrollTop=feed.scrollHeight;}

function addMsg(m){
  if(m.sys){
    const d=document.createElement('div');
    d.className='sysline';d.innerHTML='<span>'+m.sys+'</span>';
    feed.appendChild(d);scrollEnd();return;
  }
  const p=WHO[m.w];
  const row=document.createElement('div');
  row.className='row'+(p.me?' me':'');
  row.innerHTML='<img class="pfp" src="'+p.pic+'" alt="'+p.name+'">'+
    '<div class="bcol">'+(p.me?'':'<div class="who">'+p.name+'</div>')+
      '<div class="bline"><div class="bub">'+fmt(m.t)+'</div><div class="time">'+m.time+'</div></div></div>';
  feed.appendChild(row);scrollEnd();
}

function typing(m,cb){
  if(m.sys){cb();return;}
  const p=WHO[m.w];
  const row=document.createElement('div');
  row.className='row typing'+(p.me?' me':'');
  row.innerHTML='<img class="pfp" src="'+p.pic+'"><div class="bcol"><div class="bline">'+
    '<div class="bub"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div></div>';
  feed.appendChild(row);scrollEnd();
  setTimeout(()=>{row.remove();cb();},480);
}

function applyState(){
  btnBack.disabled=shown===0;
  btnNext.disabled=shown>=SCRIPT.length;
  btnNext.textContent=shown>=SCRIPT.length?'대화 끝 ✓':(shown===0?'대화 시작 ▶':'다음 메시지 ▶');
}
function next(cb){
  if(busy||shown>=SCRIPT.length)return;
  stopSpeech();
  busy=true;const m=SCRIPT[shown];
  typing(m,()=>{
    addMsg(m);shown++;applyState();busy=false;
    speak(m,()=>{if(shown>=SCRIPT.length&&!autoOn)stopAuto();cb&&cb();});
  });
}
function back(){
  if(busy||shown===0)return;
  stopAuto();stopSpeech();
  feed.removeChild(feed.lastElementChild);shown--;applyState();scrollEnd();
}
function reset(){
  stopAuto();stopSpeech();
  feed.innerHTML='<div class="daypill">광합성과 세포호흡</div>';
  shown=0;busy=false;applyState();
}

let autoOn=false;
function stopAuto(){
  autoOn=false;clearTimeout(autoTimer);autoTimer=null;
  btnAuto.classList.remove('on');btnAuto.textContent='자동';
}
function autoStep(){
  if(!autoOn)return;
  if(shown>=SCRIPT.length){stopAuto();return;}
  next(()=>{
    if(!autoOn)return;
    if(shown>=SCRIPT.length){stopAuto();return;}
    autoTimer=setTimeout(autoStep, ttsOn?700:2200);
  });
}
function toggleAuto(){
  if(autoOn){stopAuto();return;}
  autoOn=true;btnAuto.classList.add('on');btnAuto.textContent='정지';autoStep();
}

/* 소리 켜기/끄기 */
function toggleTTS(){
  if(!synth){showToast('이 브라우저는 음성 읽기를 지원하지 않습니다. 크롬이나 엣지에서 열어 주세요.');return;}
  ttsOn=!ttsOn;
  btnTTS.classList.toggle('on',ttsOn);
  btnTTS.textContent=(ttsOn?'🔊':'🔇')+' 소리';
  if(ttsOn){
    loadVoices();
    if(!koVoices.length||!koVoices.some(v=>(v.lang||'').toLowerCase().startsWith('ko'))){
      showToast('한국어 음성을 찾지 못했습니다. 윈도우 설정 → 시간 및 언어 → 음성에서 한국어 음성을 추가하면 자연스럽게 읽어 줍니다.');
    }else{
      showToast('소리 켜짐 — 소기관마다 목소리 높낮이가 다릅니다.');
    }
    const last=SCRIPT[shown-1];
    if(last)speak(last);
  }else{
    stopSpeech();
  }
}

btnNext.onclick=()=>next();btnBack.onclick=back;btnReset.onclick=reset;
btnAuto.onclick=toggleAuto;btnTTS.onclick=toggleTTS;
feed.onclick=()=>{if(drawerOpen())return;stopAuto();next();};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&drawerOpen()){closeDrawer();return;}
  if(drawerOpen())return;
  if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();stopAuto();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();back();}
});
applyState();

/* 대화상대 보기 */
const drawer=document.getElementById('drawer');
const scrim=document.getElementById('scrim');
const dlist=document.getElementById('dlist');

(function buildMembers(){
  const order=['cell','chloro','mito'];
  let html='<div class="dsec">이 세포 안에 있는 셋</div>';
  order.forEach(k=>{
    const p=WHO[k];
    html+='<div class="member"><img src="'+p.pic+'" alt="'+p.name+'">'+
      '<div class="mi"><div class="mn">'+p.name+(p.me?'<i>나</i>':'')+'</div>'+
      '<div class="ms">'+p.bio+'</div></div></div>';
  });
  dlist.innerHTML=html;
})();

function openDrawer(){drawer.classList.add('open');scrim.classList.add('open');
  drawer.setAttribute('aria-hidden','false');stopAuto();stopSpeech();
  document.getElementById('closeDrawer').focus();}
function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');}
function drawerOpen(){return drawer.classList.contains('open');}

document.getElementById('cntBtn').onclick=openDrawer;
document.getElementById('menuBtn').onclick=openDrawer;
document.getElementById('closeDrawer').onclick=closeDrawer;
scrim.onclick=closeDrawer;
</script>
